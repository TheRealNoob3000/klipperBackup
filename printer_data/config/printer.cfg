# This file contains pin mappings for the Creality CR-20 Pro. To use
# this config, the firmware should be compiled for the AVR atmega2560.

# See docs/Config_Reference.md for a description of parameters.
[include mainsail.cfg]
[include macros.cfg]
[include timelapse.cfg]

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: -16
position_max: 232
homing_speed: 65
position_min: -16

[stepper_y]
step_pin: PF6
dir_pin: PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: -23
position_max: 222
homing_speed: 65
position_min: -23

[stepper_z]
step_pin: PL3
dir_pin: !PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 250
homing_speed: 5
second_homing_speed: 3
homing_retract_dist: 5
homing_retract_speed: 2
position_min: -6.0        # negativ noetig fuer BDSENSOR_CALIBRATE

[extruder]
step_pin: PA4
dir_pin: !PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 3.464
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: Generic 3950
sensor_pin: PK5
# --- WICHTIG: Die Sicherheitsschwelle ---
min_extrude_temp: 170
max_extrude_cross_section: 1.0
max_extrude_only_distance: 100
# ---
min_temp: 0
max_temp: 270
# pressure_advance: 0.0

# Z-Probe: BDsensor-M (Mellow), ersetzt den BLTouch.
# Verkabelung am Mainboard (ehemaliger BLTouch-Anschluss):
#   Weiss -> SDA = PD3, Gelb -> CLK = PB5, Rot -> 5V, Schwarz -> GND
# Kalibrierung: BDSENSOR_CALIBRATE (nur mit enable_force_move), danach
# BDSENSOR_READ_CALIBRATION pruefen (1. Wert ~100, 2. Wert > 1. Wert + 10).
[BDsensor]
sda_pin: PD3
scl_pin: PB5
delay: 10                 # Firmware >= V1.2 erlaubt 10; haelt die IRQ-Sperrzeit auf dem AVR kurz
#z_offset: 0              # wird von SAVE_CONFIG verwaltet (zulaessig: -0.6 .. 0.6)
x_offset: 27              # Sensor sitzt 27 mm rechts der Duese
y_offset: 0
no_stop_probe:            # Mesh ohne Anhalten an den Messpunkten
position_endstop: 1.2     # Hoehe (mm), bei der Z-Homing ausloest (Empfehlung 1 - 2.8)
collision_homing: 0       # Duesen-Kontakt-Homing aus
collision_calibrate: 0
speed: 3                  # gilt fuer PROBE_ACCURACY / z_tilt
homing_cmd: G28

[force_move]
enable_force_move: true   # fuer BDsensor-Kalibrierung (SET_KINEMATIC_POSITION)

[safe_z_home]
home_xy_position: 114, 114   # Fährt die Nozzle exakt in die Mitte des Bettes
speed: 50.0                  # Angenehmes, sicheres Fahrtempo
z_hop: 5                     # Sensor beruehrungslos, 5 mm reichen
z_hop_speed: 5.0

[bed_mesh]
speed: 200                    # no_stop_probe: Mesh mit 200 mm/s ist sauber (gemessen 01.10.26)
horizontal_move_z: 1          # BDsensor ist bei 1 mm ca. doppelt so empfindlich wie bei 2 mm (Doku: 0.7 - 1.0)
zero_reference_position: 141, 114
scan_overshoot: 8
# Bettkanten (Duesen-/Sensorkoordinaten): X 0..234, Y 0..~240.
# Der BDsensor misst naeher als ~12 mm an einer Plattenkante systematisch zu hoch
# (Wirbelstrom-Spule ragt ueber die Kante) -> 15 mm Rand lassen. Ausserhalb des
# Mesh nutzt Klipper den naechsten Randwert, Drucken bis zur Kante geht trotzdem.
mesh_min: 15, 15              ; Sensor-Koordinaten, KEIN Offset addieren. Duese steht dann bei X -12 (Limit -16)
mesh_max: 219, 218            ; X: 234-15. Y: durch Achsenlimit 222 begrenzt, Kante liegt bei ~240
probe_count: 20, 20           # ~11 mm Raster; im no_stop-Modus praktisch gratis

fade_start: 1
fade_end: 10
algorithm: bicubic

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
#control: pid
#pid_Kp: 690.34
#pid_Ki: 111.47
#pid_Kd: 1068.83
min_temp: 0
max_temp: 130

[fan]
pin: PH6

[mcu]
serial: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AG0JSOV7-if00-port0

[printer]
kinematics: cartesian
max_velocity: 250
max_accel: 2900
max_z_velocity: 5
max_z_accel: 100

[pause_resume]
[display_status]

# [exclude_object]

[display]
lcd_type: uc1701
cs_pin: PA3
a0_pin: PA5
encoder_pins: ^PC4, ^PC6
click_pin: ^!PC2

# [bed_screws]
# screw1: 30,30
# screw2: 201,30
# screw3: 201,186
# screw4: 30,186

[screws_tilt_adjust]
screw1: 3, 203.5
screw1_name: hinten links (Basis)

screw2: 3, 33.5
screw2_name: vorne links

screw3: 174, 33.5
screw3_name: vorne rechts

screw4: 174, 203.5
screw4_name: hinten rechts

horizontal_move_z: 3   # BDsensor-Schnellmodus: muss innerhalb Sensor-Reichweite (<3.8mm) bleiben
speed: 100
screw_thread: CW-M4

# Schraubenpositionen = Duesenposition, damit der BDsensor (X+27) ueber der Schraube steht

[mcu rpi]
serial: /tmp/klipper_host_mcu

[adxl345]
cs_pin: rpi:None

[resonance_tester]
accel_chip: adxl345
probe_points:
    115, 115, 20 

[input_shaper]
shaper_freq_x: 62.0
shaper_type_x: mzv
shaper_freq_y: 31.2
shaper_type_y: mzv

[output_pin unload_am_ende]
pin: PA0      # Ein freier Pin auf dem Mainboard
pwm: False
value: 0

[output_pin gopro_power]
pin: rpi:gpio24      # Stromversorgung GoPro, an Pi-GPIO24 angeschlossen
pwm: False
value: 0
shutdown_value: 0    # bei Klipper-Shutdown sicherheitshalber aus

[idle_timeout]
timeout: 3600 # Setzt den Timeout auf 1 Stunde (in Sekunden)

