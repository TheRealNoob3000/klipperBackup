# Standby-Klipper fuer den CR-20 Pro (Juri, 18.11.2026)
#
# Laeuft nur, solange das Relais des Druckers AUS ist (Dienst klipper-standby).
# Die Druckerplatine hat dann keinen Strom, deshalb ist hier der Pi selbst die
# Haupt-MCU. So zeigt Mainsail keinen Fehler, obwohl der Drucker aus ist.
# Beim Einschalten stoppt systemd diesen Dienst und startet den echten Klipper
# mit printer.cfg. Hier gibt es keine Achsen, keine Heizung, keine Sensoren.

[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: none
max_velocity: 1
max_accel: 1

[virtual_sdcard]
path: /home/juri/printer_data/gcodes

[display_status]
[pause_resume]
[respond]

[idle_timeout]
timeout: 86400
gcode:
    M117 Drucker ist aus

# GoPro-Strom wie in printer.cfg (dort rpi:gpio24), damit die Kamera auch bei
# ausgeschaltetem Drucker schaltbar ist.
[output_pin gopro_power]
pin: gpio24
pwm: False
value: 0
shutdown_value: 0

[delayed_gcode standby_hinweis]
initial_duration: 2
gcode:
    M117 Drucker ist aus
    RESPOND MSG="Standby: Der Drucker ist ausgeschaltet. Einschalten ueber den Schalter 'mein_drucker', den Taster oder DRUCKER_EIN."

[gcode_macro DRUCKER_EIN]
description: Relais einschalten, danach startet der echte Klipper
gcode:
    M117 Drucker startet...
    {action_call_remote_method("set_device_power", device="status_led", state="on")}
    {action_call_remote_method("set_device_power", device="mein_drucker", state="on")}

# Der Taster am Drucker ruft bei "Klipper bereit" dieses Makro auf
# (moonraker.conf, [button mein_taster]). Im Standby heisst das: einschalten.
[gcode_macro SMART_POWER_BUTTON]
gcode:
    DRUCKER_EIN

# Ein Druckstart im Standby darf nicht hier "gedruckt" werden. Stattdessen
# wird der Drucker eingeschaltet, der Druck muss danach neu gestartet werden.
[gcode_macro SDCARD_PRINT_FILE]
rename_existing: SDCARD_PRINT_FILE_STANDBY
gcode:
    DRUCKER_EIN
    {action_raise_error("Der Drucker war aus und wird jetzt eingeschaltet. Bitte den Druck in etwa 30 Sekunden noch einmal starten.")}

# Mainsail erwartet diese Makros.
[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
gcode:
    RESPOND MSG="Standby: kein Druck aktiv."

[gcode_macro RESUME]
rename_existing: RESUME_BASE
gcode:
    RESPOND MSG="Standby: kein Druck aktiv."

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
    RESPOND MSG="Standby: kein Druck aktiv."
