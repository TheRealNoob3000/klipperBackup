# =====================================================================
#  macros.cfg  (Stand 15.10.2026) – aus macros_vorschlag.cfg, korrigiert:
#  - Filament-Temperatur wird direkt im jeweiligen Makro bestimmt (ein Hilfsmakro
#    wirkt in Klipper erst beim NAECHSTEN Aufruf, weil Makros vor Ausfuehrung
#    komplett ausgewertet werden)
#  - letzte Drucktemperatur wird dauerhaft gemerkt ([save_variables] in printer.cfg)
#  - GoPro geht auch bei CANCEL_PRINT aus
#  Unterschiede zur alten macros.cfg sind mit  ">>"  kommentiert.
# =====================================================================

# ---------------------------------------------------------------------
# Mainsail-Client-Variablen
# >> NEU. Ersetzt die eigenen PAUSE/RESUME-Makros. Die Mainsail-Versionen
#    (mainsail.cfg) koennen damit alles, was die eigenen konnten, plus:
#    - Heizung wird nach Idle-Timeout beim RESUME automatisch wieder
#      auf die alte Temperatur gebracht (bisher: kalter Extruder -> Fehler
#      oder PETG bei 200 °C weitergedruckt)
#    - Retract/Unretract beim Pausieren/Fortsetzen
#    - CANCEL_PRINT parkt ebenfalls
# ---------------------------------------------------------------------
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_x    : -15     ; wie bisher: neben dem Bett
variable_custom_park_y    : 0
variable_custom_park_dz   : 10.0    ; Z-Hop beim Pausieren (bisher 10)
variable_retract          : 1.0     ; beim PAUSE
variable_cancel_retract   : 0.0     ; >> Retract macht END_PRINT (sonst doppelt 10 mm)
variable_speed_retract    : 35.0
variable_unretract        : 1.0
variable_speed_unretract  : 35.0
variable_speed_hop        : 10.0    ; = max_z_velocity
variable_speed_move       : 150.0   ; Parkfahrt mm/s
variable_park_at_cancel   : False   ; >> Parken macht END_PRINT
variable_park_at_cancel_x : -15
variable_park_at_cancel_y : 210
variable_use_fw_retract   : False
variable_idle_timeout     : 7200    ; waehrend PAUSE 2 h statt 1 h bis Heizung aus
variable_runout_sensor    : ""
variable_user_pause_macro : ""
variable_user_resume_macro: ""
variable_user_cancel_macro: "END_PRINT"   ; >> Abbruch faehrt dieselbe Endroutine wie ein normales Druckende
gcode:

# ---------------------------------------------------------------------
[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    # >> Vorheiztemperatur relativ zur Zieltemperatur statt fix 180:
    #    PETG 255 -> 165, PLA 215 -> 150. Weich genug fuer den Unretract,
    #    aber deutlich weniger Oozing als bei 180.
    {% set PREHEAT = [EXTRUDER_TEMP - 90, 150]|max %}
    # >> Drucktemperatur dauerhaft merken -> LOAD/UNLOAD ausserhalb eines Drucks
    SAVE_VARIABLE VARIABLE=druck_temp VALUE={EXTRUDER_TEMP|int}

    SET_PIN PIN=gopro_power VALUE=1
    G21
    G90
    M83
    G92 E0
    M220 S100
    M221 S100
    BED_MESH_CLEAR

    # --- Heizen: sofort auf Zieltemperatur ---------------------------
    # >> Bisher M140 S50 -> warten -> spaeter M140 S{BED_TEMP}. Das kostet
    #    die PID-Einregelzeit bei 50 °C und das Mesh wurde auf einem 50 °C
    #    warmen Bett gemessen, gedruckt wird aber bei 60/75 °C.
    M140 S{BED_TEMP}
    M104 S{PREHEAT}

    M117 Homing
    G28
    G1 X-14 Y221 Z15 F9000          ; >> F5000 -> F9000 (150 mm/s)

    # --- Bett fast auf Temperatur, dann Z-Referenz + Mesh -------------
    # >> Warten bis 8 °C unter Ziel: die letzten Grad holt das Bett
    #    waehrend G28 Z + Mesh auf, es entsteht keine Leerlaufzeit.
    M117 Bett heizt
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP - 8}

    # Duese jetzt voll heizen: 40-W-Patrone braucht von 160 auf 250 °C
    # etwa so lange wie G28 Z + adaptives Mesh.
    M104 S{EXTRUDER_TEMP}
    M117 Z-Referenz
    G28 Z                           ; Z neu auf dem warmen Bett (BDsensor-Drift)
    M117 Mesh
    BED_MESH_CALIBRATE ADAPTIVE=1

    # >> Optional Echtzeit-Leveling des BDsensors fuer die erste Schicht.
    #    END_PRINT schaltet es bisher aus, obwohl es nirgends eingeschaltet
    #    wird. Zum Aktivieren Kommentar entfernen (erst ohne Druckauftrag testen):
    #BDSENSOR_SET REAL_TIME_HEIGHT=0.4

    M117 Heizen
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP - 1}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_TEMP}

    # --- Prime (Ablauf wie bisher, nur schnellere Leerfahrten) --------
    G1 Z10 F600
    G1 X-14 Y30 F9000               ; >> F2900 -> F9000
    G1 Z0.35 F600
    M117 Rotze weg
    G1 E5 F1500                     ; End-Retract (5 mm) zurueck
    G92 E0
    G1 E5 F300                      ; Blob neben dem Bett
    G1 X20 F2000                    ; ueber die Bettkante wischen
    G1 Z0.5 F600
    G92 E0
    G1 X5 Y40 F6000                 ; >> Default-F -> F6000
    G1 Z0.24 F600
    G1 Y80 E4 F1400                 ; Prime-Linie
    G1 E-0.5 F3000
    G1 Z5 F600
    G1 X10 Y10 F9000                ; >> F1400 -> F9000
    G92 E0
    M117 LET'S GOOOOO

# ---------------------------------------------------------------------
[gcode_macro END_PRINT]
description: Endroutine (Wischen, Parken, Bett ablassen, alles aus) – Orca-Druckende und Abbruch
gcode:
    {% set pos = printer.toolhead.position %}
    {% set mn = printer.toolhead.axis_minimum %}
    {% set mx = printer.toolhead.axis_maximum %}
    {% set homed = "xyz" in printer.toolhead.homed_axes %}
    # Extrudieren nur, wenn heiss genug (sonst bricht Klipper das Makro ab, z. B. Abbruch waehrend des Aufheizens)
    {% set heiss = printer.extruder.temperature >= printer.configfile.settings.extruder.min_extrude_temp + 5 %}
    {% set E = "E-5" if heiss else "" %}

    M400
    BDSENSOR_SET REAL_TIME_HEIGHT=0
    M104 S0
    M83
    {% if homed %}
        G90
        # Wischen + 2 mm hoch + 5 mm Retract; Ziel auf Achsgrenzen begrenzt (z. B. wenn schon geparkt)
        G1 X{[pos.x - 2, mn.x]|max} Y{[pos.y - 2, mn.y]|max} Z{[pos.z + 2, mx.z]|min} {E} F3000
        G1 X-15 Y210 F9000
    {% elif heiss %}
        G1 E-5 F2100
    {% endif %}

    {% if printer['output_pin unload_am_ende'].value > 0 and heiss %}
        M117 Entlade Fil.
        G1 E-20 F600
    {% else %}
        M117 Fil. bleibt
    {% endif %}

    # Bett ablassen (70 mm, sonst so weit wie moeglich)
    {% if homed %}
        {% set z_neu = [pos.z + 72.0, mx.z - 10.0]|min %}
        {% if z_neu > pos.z + 2 %}
            G1 Z{z_neu} F600
        {% endif %}
    {% endif %}

    TURN_OFF_HEATERS
    M106 S0
    SET_PIN PIN=gopro_power VALUE=0

    # >> M84 schaltet in Klipper IMMER alle Motoren ab; so bleibt Z bestromt (bis idle_timeout):
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0

    M117 Druck fertig!

# ---------------------------------------------------------------------
# Streamdeck-Taster (Bitfocus Companion auf dem Pi)
# ---------------------------------------------------------------------
[gcode_macro STREAMDECK_DRUCK_BEENDEN]
description: Streamdeck: laufenden Druck abbrechen + Endroutine; ohne Druck nur Endroutine
gcode:
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        RESPOND MSG="Streamdeck: Druck wird abgebrochen"
        CANCEL_PRINT                ; Mainsail-Abbruch -> END_PRINT (user_cancel_macro)
    {% else %}
        END_PRINT
    {% endif %}

[gcode_macro BETT_PUTZEN]
description: Kopf nach links hinten, Bett nach vorne, Duese hoch – zum Bettputzen (nicht waehrend eines Drucks)
gcode:
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        RESPOND TYPE=error MSG="BETT_PUTZEN geht nicht waehrend eines Drucks"
    {% else %}
        {% set homed = printer.toolhead.homed_axes %}
        {% if 'x' not in homed or 'y' not in homed %}
            G28 X Y                 ; safe_z_home hebt vorher 5 mm an
        {% endif %}
        G90
        {% if 'z' in homed %}
            {% set z = printer.toolhead.position.z %}
            {% set z_ziel = [[z, 80.0]|max, printer.toolhead.axis_maximum.z - 10.0]|min %}
            G1 Z{z_ziel} F600
        {% else %}
            RESPOND MSG="Z ist nicht referenziert – Duese wird nicht weiter angehoben"
        {% endif %}
        G1 X-15 Y210 F9000          ; Kopf links hinten = Bett ganz vorne
        M400
        M117 Bett frei zum Putzen
    {% endif %}

[gcode_macro MOTOREN_AUS]
description: Alle Motoren stromlos (nicht waehrend eines Drucks)
gcode:
    {% if printer.print_stats.state in ['printing', 'paused'] %}
        RESPOND TYPE=error MSG="MOTOREN_AUS geht nicht waehrend eines Drucks"
    {% else %}
        M84
        M117 Motoren aus
    {% endif %}

# ---------------------------------------------------------------------
# Filamentwechsel
# ---------------------------------------------------------------------
# >> Temperatur fuer Laden/Entladen (in beiden Makros identisch):
#    1. aktuelles Heizziel (laufender Druck / M600 / manuell aufgeheizt)
#    2. von Mainsail-PAUSE gemerkte Temperatur (Heizung nach Timeout aus)
#    3. Drucktemperatur des letzten Drucks (save_variables, uebersteht Neustarts)
#    4. sonst 240 (fuer PLA und PETG brauchbar)
#    Immer ueberschreibbar: UNLOAD_FILAMENT TEMP=215

[gcode_macro UNLOAD_FILAMENT]
description: Zieht das Filament sicher aus dem Extruder
gcode:
    {% set saved = printer['gcode_macro RESUME'].last_extruder_temp %}
    {% set gemerkt = printer.save_variables.variables.druck_temp|default(240) %}
    {% if printer.extruder.target > 170 %}{% set t = printer.extruder.target %}
    {% elif saved.temp > 170 %}{% set t = saved.temp %}
    {% else %}{% set t = gemerkt %}{% endif %}
    {% set TEMP = params.TEMP|default(t)|float %}
    RESPOND MSG="Filament-Temperatur: {TEMP|int} °C"
    {% if printer.extruder.temperature < TEMP - 5 %}
        M117 Heize auf {TEMP}
        M104 S{TEMP}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={TEMP - 5}
    {% endif %}
    M117 Entlade Fil.
    G91
    G1 E5 F300
    G1 E-10 F3000
    G1 E-20 F600
    G90
    M117 Fil. entladen!

[gcode_macro LOAD_FILAMENT]
description: Laedt neues Filament und spuelt die alte Farbe raus
gcode:
    {% set saved = printer['gcode_macro RESUME'].last_extruder_temp %}
    {% set gemerkt = printer.save_variables.variables.druck_temp|default(240) %}
    {% if printer.extruder.target > 170 %}{% set t = printer.extruder.target %}
    {% elif saved.temp > 170 %}{% set t = saved.temp %}
    {% else %}{% set t = gemerkt %}{% endif %}
    {% set TEMP = params.TEMP|default(t)|float %}
    RESPOND MSG="Filament-Temperatur: {TEMP|int} °C"
    {% if printer.extruder.temperature < TEMP - 5 %}
        M117 Heize auf {TEMP}
        M104 S{TEMP}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={TEMP - 5}
    {% endif %}
    M117 Lade Fil.
    G91
    G1 E30 F200                     ; >> F300 -> F200: 3,3 mm/s = 8 mm³/s, schonendes Spuelen
    G1 E-3 F600
    G90
    M117 Fil. geladen!

[gcode_macro _PURGE_FILAMENT]
gcode:
    G91
    G1 E25 F200
    G90
    G4 P500

[gcode_macro M600]
description: Filamentwechsel Start
gcode:
    PAUSE                           ; Mainsail-PAUSE (parkt, retract, merkt Temperatur)
    UNLOAD_FILAMENT                 ; >> ohne TEMP= -> nimmt die Drucktemperatur
    _LED_TASTER_ON
    M117 Filament einlegen & Taster druecken

# >> Die eigenen [gcode_macro PAUSE] / [gcode_macro RESUME] sind entfernt.
#    Sie haben die Mainsail-Versionen bisher stillschweigend ueberschrieben
#    (gleicher Abschnittsname, spaetere Datei gewinnt).

# ---------------------------------------------------------------------
# Smart Power Logic (unveraendert bis auf LOAD_FILAMENT ohne TEMP=200)
# ---------------------------------------------------------------------
[gcode_macro SMART_POWER_BUTTON]
variable_shutdown_mode: 0
variable_led_state: 0
gcode:
  {% if printer.pause_resume.is_paused %}
      _LED_TASTER_OFF
      M117 Lade Filament...
      LOAD_FILAMENT                 ; >> vorher LOAD_FILAMENT TEMP=200
      G4 P2000
      _PURGE_FILAMENT
      RESUME
  {% else %}
      {% set mode = printer["gcode_macro SMART_POWER_BUTTON"].shutdown_mode %}
      {% if mode == 0 %}
          SET_GCODE_VARIABLE MACRO=SMART_POWER_BUTTON VARIABLE=shutdown_mode VALUE=1
          SET_GCODE_VARIABLE MACRO=SMART_POWER_BUTTON VARIABLE=led_state VALUE=0
          UPDATE_DELAYED_GCODE ID=led_blinker DURATION=0.8
          M117 Drucker Off...
          {action_respond_info("Modus 1 aktiv: Drucker wird nach Abkuehlen abgeschaltet.")}
          UPDATE_DELAYED_GCODE ID=wait_for_temp DURATION=1.0
      {% elif mode == 1 %}
          SET_GCODE_VARIABLE MACRO=SMART_POWER_BUTTON VARIABLE=shutdown_mode VALUE=2
          UPDATE_DELAYED_GCODE ID=led_blinker DURATION=0.3
          M117 Pi Shutdown...
          {action_respond_info("Modus 2 aktiv: Pi & Drucker werden nach Abkuehlen abgeschaltet.")}
      {% else %}
          SET_GCODE_VARIABLE MACRO=SMART_POWER_BUTTON VARIABLE=shutdown_mode VALUE=0
          UPDATE_DELAYED_GCODE ID=led_blinker DURATION=0
          UPDATE_DELAYED_GCODE ID=wait_for_temp DURATION=0
          {action_call_remote_method("set_device_power", device="status_led", state="off")}
          M117 Abbruch!
          {action_respond_info("Shutdown durch Taster abgebrochen.")}
      {% endif %}
  {% endif %}

[delayed_gcode led_blinker]
gcode:
  {% set mode = printer["gcode_macro SMART_POWER_BUTTON"].shutdown_mode %}
  {% set current_state = printer["gcode_macro SMART_POWER_BUTTON"].led_state %}
  {% if mode > 0 %}
    {% if current_state == 0 %}
      {action_call_remote_method("set_device_power", device="status_led", state="on")}
      SET_GCODE_VARIABLE MACRO=SMART_POWER_BUTTON VARIABLE=led_state VALUE=1
    {% else %}
      {action_call_remote_method("set_device_power", device="status_led", state="off")}
      SET_GCODE_VARIABLE MACRO=SMART_POWER_BUTTON VARIABLE=led_state VALUE=0
    {% endif %}
    {% if mode == 1 %}
      UPDATE_DELAYED_GCODE ID=led_blinker DURATION=0.8
    {% elif mode == 2 %}
      UPDATE_DELAYED_GCODE ID=led_blinker DURATION=0.3
    {% endif %}
  {% endif %}

[gcode_macro TEMPERATURE_WAIT_AND_OFF]
gcode:
  {% set mode = printer["gcode_macro SMART_POWER_BUTTON"].shutdown_mode %}
  {% if mode > 0 %}
    {% if printer.print_stats.state == "printing" or printer.print_stats.state == "paused" %}
      M117 Warte a. Ende
      UPDATE_DELAYED_GCODE ID=wait_for_temp DURATION=10
    {% elif printer.extruder.temperature > 50 %}
      M117 Hotend kuehlt
      UPDATE_DELAYED_GCODE ID=wait_for_temp DURATION=10
    {% else %}
      M117 Power Off!
      SET_GCODE_VARIABLE MACRO=SMART_POWER_BUTTON VARIABLE=shutdown_mode VALUE=0
      UPDATE_DELAYED_GCODE ID=led_blinker DURATION=0
      {action_call_remote_method("set_device_power", device="status_led", state="off")}
      G4 P1000
      {% if mode == 1 %}
        {action_call_remote_method("set_device_power", device="mein_drucker", state="off")}
      {% elif mode == 2 %}
        {action_call_remote_method("shutdown_machine")}
      {% endif %}
    {% endif %}
  {% endif %}

[delayed_gcode wait_for_temp]
gcode:
  TEMPERATURE_WAIT_AND_OFF

[delayed_gcode boot_blinker]
initial_duration: 1.0
gcode:
  {action_call_remote_method("set_device_power", device="status_led", state="off")}
  G4 P250
  {action_call_remote_method("set_device_power", device="status_led", state="on")}
  G4 P250
  {action_call_remote_method("set_device_power", device="status_led", state="off")}
  G4 P250
  {action_call_remote_method("set_device_power", device="status_led", state="on")}
  G4 P250
  {action_call_remote_method("set_device_power", device="status_led", state="off")}
  M117 Drucker bereit!

[gcode_macro _LED_TASTER_ON]
gcode:
    {action_call_remote_method("set_device_power", device="status_led", state="on")}

[gcode_macro _LED_TASTER_OFF]
gcode:
    {action_call_remote_method("set_device_power", device="status_led", state="off")}


[gcode_macro FILAMENT_TEMP_INFO]
description: Zeigt, welche Temperatur LOAD/UNLOAD_FILAMENT gerade nehmen wuerden (ohne Bewegung)
gcode:
    {% set saved = printer['gcode_macro RESUME'].last_extruder_temp %}
    {% set gemerkt = printer.save_variables.variables.druck_temp|default(240) %}
    {% if printer.extruder.target > 170 %}{% set t = printer.extruder.target %}
    {% elif saved.temp > 170 %}{% set t = saved.temp %}
    {% else %}{% set t = gemerkt %}{% endif %}
    {% set TEMP = params.TEMP|default(t)|float %}
    RESPOND MSG="LOAD/UNLOAD wuerde heizen auf: {TEMP|int} °C"
